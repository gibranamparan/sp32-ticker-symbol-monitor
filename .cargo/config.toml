[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
WIFI_SSID = "Wokwi-GUEST"
WIFI_PASS = ""
FETCH_INTERVAL_SECS = "60"
PANEL_TEST = "0"
TIMEZONE = "UTC-6"
